<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pop;src:url(../assets/fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Pop;src:url(../assets/fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Pop;src:url(../assets/fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Serif;src:url(../assets/fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Serif;src:url(../assets/fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:Blk;src:url(../assets/fonts/ArchivoBlack-Regular.ttf)}
@font-face{font-family:DMS;src:url(../assets/fonts/DMSerifDisplay-Regular.ttf)}
@font-face{font-family:Pop;src:url(../assets/fonts/Poppins-LightItalic.ttf);font-weight:300;font-style:italic}
:root{--acc:#E8603C;--ink:#fff;--card:#1b1b1f;--line:#2e2e35;--on-acc:#fff;--body:#e9e9ee;--shadow:rgba(0,0,0,.45);--hl:var(--acc);--word:var(--acc);--wordbg:none}
html,body{margin:0;background:transparent;overflow:hidden}
#s{position:absolute;inset:0;font-family:Pop;color:var(--ink)}
.abs{position:absolute}
.serif{font-family:Serif;font-style:italic;font-weight:400}
.box{background:var(--acc);color:var(--on-acc);border-radius:14px;padding:.05em .35em;display:inline-block;font-family:Serif;font-style:normal}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 20px 60px var(--shadow)}
.ico{display:inline-block;background:var(--acc);border-radius:14px;padding:10px;line-height:0}
.ico svg{stroke:var(--on-acc)}
</style></head><body><div id="s"></div>
<script>
const Q=new URLSearchParams(location.search);
const P=k=>Q.get(k)||'';
const W=+P('w')||1080,H=+P('h')||864,TYPE=P('type')||'title',DUR=+P('dur')||2.5;
document.body.style.width=W+'px';document.body.style.height=H+'px';
// themes from what working channels use (2026-11 palette study): dark (Patrick Dang), paper (Nate Herk / Vaibhav),
// highlight (Liam Ottley / AI Master yellow), navy (Mark Tilbury), mint (Symone). Any var can be overridden by param.
const THEMES={dark:{},
 paper:{word:'#16181D',wordbg:'linear-gradient(transparent 58%,#FFE45C 58%)',acc:'#2F6FED',ink:'#16181D',card:'#FFFFFF',line:'#E3E1DA','on-acc':'#fff',body:'#2A2D34',shadow:'rgba(30,30,40,.12)',hl:'#FFE45C'},
 highlight:{word:'#111',wordbg:'linear-gradient(transparent 58%,#F2C524 58%)',acc:'#F2C524',ink:'#111',card:'#FFFFFF',line:'#E6E2D3','on-acc':'#111',body:'#222',shadow:'rgba(0,0,0,.14)',hl:'#F2C524'},
 navy:{acc:'#E9B949',ink:'#FFFFFF',card:'#22345A',line:'#34497A','on-acc':'#14213D',body:'#E6ECF7',shadow:'rgba(0,0,0,.35)',hl:'#E9B949'},
 mint:{word:'#14171A',wordbg:'linear-gradient(transparent 58%,#BBF7D0 58%)',acc:'#16A34A',ink:'#14171A',card:'#FFFFFF',line:'#DDE7E0','on-acc':'#fff',body:'#23302A',shadow:'rgba(20,60,40,.12)',hl:'#BBF7D0'}};
const TH=THEMES[P('theme')]||{}; for(const k in TH) document.documentElement.style.setProperty('--'+k,TH[k]);
for(const k of ['acc','ink','card','line','on-acc','body']) if(P(k)) document.documentElement.style.setProperty('--'+k,P(k));
if(P('bg'))document.body.style.background=P('bg');
const S=document.getElementById('s');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3), back=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const outT=t=>seg(t,DUR-.25,DUR); // fade-out window
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function icon(name,size=40){try{const r=await fetch('../assets/icons/'+name+'.svg');let t=await r.text();return t.replace(/width="\d+"/,`width="${size}"`).replace(/height="\d+"/,`height="${size}"`)}catch(e){return''}}
const u=Math.min(W,H)/864*(+P('k')||1); // scale unit (k = extra zoom)
let render=()=>{};

async function build(){
 if(TYPE==='title'){ // l1 / money / l2  (serif, money in accent box)
  S.innerHTML=`<div class="abs" id="g" style="left:0;right:0;top:${H*.5}px;transform:translateY(-50%);text-align:center">
   <div id="a" class="serif" style="font-size:${74*u}px">${esc(P('l1'))}</div>
   <div id="b" style="margin:${10*u}px 0"><span class="box" style="font-size:${112*u}px">${esc(P('money'))}</span></div>
   <div id="c" class="serif" style="font-size:${74*u}px">${esc(P('l2'))}</div></div>`;
  if(!P('l2'))document.getElementById('c').remove(); if(!P('money'))document.getElementById('b').remove();
  render=t=>{[...S.querySelectorAll('#g>div')].forEach((e,i)=>{const k=eo(seg(t,i*.12,i*.12+.35));e.style.opacity=k*(1-outT(t));e.style.transform=`translateY(${(1-k)*30*u}px) scale(${e.id==='b'?.7+.3*back(seg(t,.12,.5)):1})`})};
 }
 else if(TYPE==='chapter'){ // small label + huge word
  S.innerHTML=`<div class="abs" style="left:${80*u}px;bottom:${120*u}px"><div id="a" class="serif" style="font-size:${48*u}px">${esc(P('label'))}</div>
   <div id="b" style="font-weight:800;font-size:${130*u}px;line-height:1;color:var(--word);letter-spacing:-.02em"><span style="background:var(--wordbg);padding:0 .08em">${esc(P('keepcase')?P('word'):P('word').toUpperCase())}</span></div></div>`;
  if(P('center')){const g=S.firstChild;g.style.cssText=`left:0;right:0;top:50%;transform:translateY(-50%);text-align:center`}
  render=t=>{const a=eo(seg(t,0,.35)),b=eo(seg(t,.1,.5)),o=1-outT(t);
   const A=document.getElementById('a'),B=document.getElementById('b');A.style.opacity=a*o;B.style.opacity=b*o;
   B.style.clipPath=`inset(0 ${100-100*b}% 0 0)`;A.style.transform=`translateX(${(1-a)*-40}px)`};
 }
 else if(TYPE==='lower'){ // name + role, optional photo, arrow
  const photo=P('photo')?`<img src="${P('photo')}" style="width:${150*u}px;height:${150*u}px;object-fit:cover;border-radius:18px;filter:grayscale(1)">`:'';
  S.innerHTML=`<div class="abs" id="g" style="left:${70*u}px;bottom:${70*u}px;display:flex;align-items:center;gap:${24*u}px">${photo}
   <div><svg id="ar" width="${130*u}" height="${58*u}" viewBox="0 0 90 40" style="display:block"><path d="M85 30 C60 5 30 5 8 22 M8 22 l14 -2 M8 22 l4 13" fill="none" stroke="var(--acc)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="140"/></svg>
   <div id="n" style="font-weight:700;font-size:${64*u}px;color:var(--word);line-height:1.1"><span style="background:var(--wordbg)">${esc(P('name'))}</span></div>
   <div id="r" class="serif" style="font-size:${44*u}px">${esc(P('role'))}</div></div></div>`;
  render=t=>{const k=eo(seg(t,0,.4)),o=1-outT(t);const g=document.getElementById('g');g.style.opacity=k*o;g.style.transform=`translateX(${(1-k)*-60}px)`;
   S.querySelector('#ar path').style.strokeDashoffset=140*(1-eo(seg(t,.2,.7)))};
 }
 else if(TYPE==='counter'){ // big number counting up
  const raw=P('value')||'$10,000', num=+raw.replace(/[^\d.]/g,''), pre=raw.match(/^[^\d]*/)[0], suf=raw.match(/[^\d.,]*$/)[0];
  S.innerHTML=`<div class="abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
   <div id="v" style="font-weight:800;font-size:${170*u}px;letter-spacing:-.03em;text-shadow:0 8px 40px var(--shadow)"></div>
   <div id="c" class="serif" style="font-size:${52*u}px">${esc(P('caption'))}</div></div>`;
  render=t=>{const k=eo(seg(t,0,Math.min(1.4,DUR*.6))),o=1-outT(t);const v=document.getElementById('v');
   v.textContent=pre+Math.round(num*k).toLocaleString('en-US')+suf;v.style.opacity=seg(t,0,.15)*o;
   v.style.transform=`scale(${.85+.15*back(seg(t,0,.5))})`;document.getElementById('c').style.opacity=seg(t,.4,.7)*o};
 }
 else if(TYPE==='prompt'){ // "Type this into <tool>" + typing prompt box
  const txt=P('text');
  S.innerHTML=`<div class="abs" style="left:0;right:0;top:${H*.12}px;text-align:center;font-weight:700;font-size:${46*u}px">${esc(P('head')||'Type This Into')} <span style="color:var(--acc)">${esc(P('tool')||'Claude')}</span></div>
   <div id="cd" class="card abs" style="left:${W*.08}px;right:${W*.08}px;top:${H*.28}px;padding:${30*u}px">
   <div style="display:flex;gap:8px;margin-bottom:${18*u}px"><i style="width:12px;height:12px;border-radius:9px;background:#ff5f57"></i><i style="width:12px;height:12px;border-radius:9px;background:#febc2e"></i><i style="width:12px;height:12px;border-radius:9px;background:#28c840"></i></div>
   <div id="tx" style="font-weight:500;font-size:${34*u}px;line-height:1.45;min-height:${150*u}px;color:var(--body)"></div>
   <div style="text-align:right"><span style="background:var(--acc);color:var(--on-acc);border-radius:10px;padding:6px 14px;font-weight:700;font-size:${26*u}px">↑</span></div></div>`;
  render=t=>{const cd=document.getElementById('cd'),k=eo(seg(t,0,.35)),o=1-outT(t);cd.style.opacity=k*o;S.firstElementChild.style.opacity=k*o;
   cd.style.transform=`translateY(${(1-k)*40}px)`;const n=Math.floor(txt.length*seg(t,.4,Math.max(.6,DUR-.9)));
   document.getElementById('tx').innerHTML=esc(txt.slice(0,n))+(n<txt.length&&Math.floor(t*3)%2===0?'|':'')};
 }
 else if(TYPE==='diagram'){ // items "Your Skill|AI" joined by op, result below
  const items=P('items').split('|').filter(Boolean), icons=(P('icons')||'').split('|'), op=P('op')||'+', res=P('result');
  const ic=await Promise.all(items.map((_,i)=>icon(icons[i]||'sparkles',36*u)));
  const ri=res?await icon(P('ricon')||'rocket',32*u):'';
  S.innerHTML=`<div class="abs" style="left:0;right:0;top:${H*.1}px;text-align:center;font-weight:700;font-size:${42*u}px" id="hd">${esc(P('head'))}</div>
  <div class="abs" id="row" style="left:0;right:0;top:${H*.3}px;display:flex;justify-content:center;align-items:center;gap:${22*u}px;transform-origin:50% 50%">${items.map((s,i)=>`${i?`<div class="op" style="font-weight:800;font-size:${50*u}px;color:var(--acc)">${esc(op)}</div>`:''}<div class="card it" style="padding:${22*u}px ${28*u}px;display:flex;align-items:center;gap:${16*u}px"><span class="ico">${ic[i]}</span><span style="font-weight:700;font-size:${34*u}px;white-space:nowrap">${esc(s)}</span></div>`).join('')}</div>
  ${res?`<div class="abs" id="rs" style="left:0;right:0;top:${H*.62}px;text-align:center"><span style="display:inline-flex;align-items:center;gap:12px;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:${16*u}px ${34*u}px;font-weight:700;font-size:${36*u}px">${ri}${esc(res)}</span></div>`:''}`;
  let fitted=false;
  render=t=>{if(!fitted){fitted=true;const row=document.getElementById('row');   // shrink wide rows to fit the frame
    const kids=[...row.children];const need=kids.reduce((a,e)=>a+e.offsetWidth,0)+(kids.length-1)*22*u;
    if(need>W*.92)row.style.transform=`scale(${(W*.92/need).toFixed(3)})`;}
   const o=1-outT(t);document.getElementById('hd').style.opacity=seg(t,0,.3)*o;
   const all=[...S.querySelectorAll('.it,.op')];all.forEach((e,i)=>{const k=eo(seg(t,.15+i*.18,.45+i*.18));e.style.opacity=k*o;e.style.transform=`scale(${.8+.2*back(k)})`});
   const r=document.getElementById('rs');if(r){const k=eo(seg(t,.3+all.length*.18,.7+all.length*.18));r.style.opacity=k*o;r.style.transform=`translateY(${(1-k)*30}px)`}};
 }
 else if(TYPE==='checklist'){ // items tick off one by one (style refs 3, 6). layout list|grid, ticks spread over the card
  const items=P('items').split('|').filter(Boolean), icons=(P('icons')||'').split('|'), subs=(P('subs')||'').split('|'), n=items.length;
  const grid=P('layout')==='grid';
  const ic=await Promise.all(items.map((_,i)=>icon(icons[i]||'circle',30*u))); const ck=await icon('check',22*u);
  const tw=grid?W*.40:W*.78;
  S.innerHTML=`<div class="abs" id="hd" style="left:0;right:0;top:${H*.08}px;text-align:center;font-weight:700;font-size:${44*u}px">${esc(P('head'))}</div>
   <div class="abs" style="left:0;right:0;top:${H*.22}px;display:flex;flex-wrap:wrap;justify-content:center;gap:${18*u}px">${items.map((t,i)=>`
    <div class="card it" style="width:${tw}px;box-sizing:border-box;padding:${18*u}px ${20*u}px;display:flex;align-items:center;gap:${16*u}px;border-radius:${18*u}px">
     <span class="ico" style="padding:${8*u}px">${ic[i]}</span>
     <span style="flex:1;text-align:left"><div style="font-weight:700;font-size:${30*u}px;line-height:1.15">${esc(t)}</div>${subs[i]?`<div style="font-size:${20*u}px;opacity:.55;margin-top:${4*u}px">${esc(subs[i])}</div>`:''}</span>
     <span class="ck" style="flex:none;width:${38*u}px;height:${38*u}px;border-radius:50%;border:${3*u}px solid var(--line);display:flex;align-items:center;justify-content:center;box-sizing:border-box">${ck}</span></div>`).join('')}</div>
   ${P('result')?`<div class="abs" id="rs" style="left:0;right:0;top:${H*(grid?.80:.86)}px;text-align:center"><span style="background:var(--acc);color:var(--on-acc);font-weight:700;font-size:${32*u}px;border-radius:999px;padding:${12*u}px ${30*u}px">${esc(P('result'))}</span></div>`:''}`;
  S.querySelectorAll('.ck svg').forEach(e=>{e.style.stroke='#fff';e.style.opacity=0});
  const tick=i=>.7+i*Math.max(.35,(DUR-1.6)/Math.max(1,n-1));
  render=t=>{const o=1-outT(t);document.getElementById('hd').style.opacity=seg(t,0,.3)*o;
   S.querySelectorAll('.it').forEach((e,i)=>{const k=eo(seg(t,.1+i*.08,.45+i*.08));e.style.opacity=k*o;e.style.transform=`translateY(${(1-k)*20}px)`;
    const c=e.querySelector('.ck'),on=seg(t,tick(i),tick(i)+.18);c.style.background=on>0?'var(--acc)':'transparent';c.style.borderColor=on>0?'var(--acc)':'var(--line)';
    c.style.transform=`scale(${on>0&&on<1?1+.3*Math.sin(on*Math.PI):1})`;c.querySelector('svg').style.opacity=on;e.style.borderColor=on>0?'var(--acc)':'var(--line)'});
   const r=document.getElementById('rs');if(r){const k=eo(seg(t,tick(n-1)+.3,tick(n-1)+.7));r.style.opacity=k*o;r.style.transform=`scale(${.8+.2*back(k)})`}};
 }
 else if(TYPE==='sticker'){ // icon sticker that pops in next to the speaker (style refs 1, 4). icon | img, optional label
  const big=Math.min(W,H*(P('label')?.79:1))*.62; const ih=P('img')?`<img src="${P('img')}" style="width:${big*.62}px;height:${big*.62}px;object-fit:contain">`:await icon(P('icon')||'sparkles',big*.5);
  S.innerHTML=`<div class="abs" id="st" style="left:50%;top:${P('label')?'42%':'50%'};transform:translate(-50%,-50%)">
   <div class="card" style="width:${big}px;height:${big}px;border-radius:${big*.24}px;display:flex;align-items:center;justify-content:center;background:#fff;border:none;box-shadow:0 ${big*.06}px ${big*.18}px rgba(0,0,0,.28)">${ih}</div>
   ${P('label')?`<div style="margin-top:${big*.08}px;text-align:center;font-weight:800;font-size:${big*.2}px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap">${esc(P('label'))}</div>`:''}</div>`;
  const sv=S.querySelector('svg'); if(sv){sv.style.stroke=P('color')||'var(--acc)';}
  render=t=>{const k=seg(t,0,.35),o=1-outT(t);const e=document.getElementById('st');e.style.opacity=Math.min(1,k*3)*o;
   const sc=k<1?back(k,2.6):1;e.style.transform=`translate(-50%,-50%) scale(${sc*(1-.15*outT(t))}) rotate(${(1-eo(k))*-12}deg)`};
 }
 else if(TYPE==='comment'){ // CTA: "Comment" + keyword pill + a mock comment bubble (style ref 2)
  const hi=await icon('heart',26*u);
  S.innerHTML=`<div class="abs" style="left:0;right:0;top:${H*.30}px;text-align:center">
   <div id="c1" class="serif" style="font-size:${70*u}px">${esc(P('l1')||'Comment')}</div>
   <div id="c2" style="margin-top:${8*u}px"><span style="display:inline-block;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:${86*u}px;border-radius:${18*u}px;padding:0 ${26*u}px;letter-spacing:.02em">${esc((P('word')||'GUIDE').toUpperCase())}</span></div>
   <div id="c3" class="card" style="display:inline-flex;align-items:center;gap:${14*u}px;margin-top:${26*u}px;padding:${12*u}px ${22*u}px;border-radius:999px">
     <span style="width:${30*u}px;height:${30*u}px;border-radius:50%;background:var(--acc);display:inline-block"></span>
     <span style="font-weight:700;font-size:${30*u}px;color:var(--ink)">${esc((P('word')||'GUIDE').toUpperCase())}</span>
     <span class="hrt" style="line-height:0;margin-left:${40*u}px">${hi}</span></div>
   <div id="c4" class="serif" style="font-size:${40*u}px;margin-top:${18*u}px">${esc(P('l2')||'')}</div></div>`;
  S.querySelector('.hrt svg').style.stroke='#e5484d';
  render=t=>{const o=1-outT(t);['c1','c2','c3','c4'].forEach((id,i)=>{const e=document.getElementById(id);const k=eo(seg(t,.1+i*.18,.45+i*.18));e.style.opacity=k*o;e.style.transform=`translateY(${(1-k)*24}px) scale(${id==='c2'?.75+.25*back(k):1})`});
   const h=S.querySelector('.hrt svg');if(t>1.3){h.style.fill='#e5484d';h.style.transform=`scale(${1+.25*Math.max(0,1-(t-1.3)*4)})`}};
 }
 else if(TYPE==='band'){ // studio hook: dark band at the seam, l1 in bright green heavy type, l2 thin italic white (ref 7)
  const y=(+P('y')||.45)*H, bh=(+P('bh')||.13)*H;
  S.innerHTML=`<div class="abs" id="bd" style="left:0;right:0;top:${y-bh/2}px;height:${bh}px;background:${P('band')||'rgba(8,8,10,.92)'};display:flex;flex-direction:column;align-items:center;justify-content:center;border-top:2px solid rgba(255,255,255,.85);border-bottom:2px solid rgba(255,255,255,.85)">
   <div id="b1" style="font-family:Blk;font-size:${bh*.36}px;letter-spacing:-.03em;color:${P('c1')||'#3BEA5C'};white-space:nowrap;line-height:1.05">${esc(P('l1'))}</div>
   <div id="b2" style="font-family:Pop;font-style:italic;font-weight:300;font-size:${bh*.27}px;letter-spacing:-.02em;color:#fff;white-space:nowrap;line-height:1.1">${esc(P('l2'))}</div></div>`;
  const fit=e=>{const s=Math.min(1,W*.94/e.scrollWidth);e.style.transform=`scale(${s})`};fit(document.getElementById('b1'));fit(document.getElementById('b2'));
  render=t=>{const o=1-outT(t),k=eo(seg(t,0,.3));const b=document.getElementById('bd');b.style.opacity=o;b.style.clipPath=`inset(0 ${(1-k)*50}% 0 ${(1-k)*50}%)`;
   ['b1','b2'].forEach((id,i)=>{const e=document.getElementById(id);const q=eo(seg(t,.15+i*.12,.45+i*.12));e.style.opacity=q;e.style.translate=`0 ${(1-q)*12}px`})};
 }
 else if(TYPE==='bignum'){ // studio list: giant slanted lime number on the left of a full-screen B-roll (ref 7)
  const fs=(+P('size')||.22)*H;
  S.innerHTML=`<div class="abs" id="bn" style="left:${(+P('x')||.04)*W}px;top:${(+P('y')||.5)*H-fs*.55}px;font-family:Blk;font-size:${fs}px;line-height:1;color:${P('color')||'#D7FF3A'};transform:skewX(-10deg);text-shadow:0 ${fs*.03}px ${fs*.08}px rgba(0,0,0,.35)">${esc(P('n')||'1')}</div>`;
  render=t=>{const o=1-outT(t),k=seg(t,0,.28);const e=document.getElementById('bn');e.style.opacity=Math.min(1,k*2.5)*o;
   e.style.transform=`translateX(${(1-eo(k))*-W*.25}px) skewX(-10deg) scale(${1+.25*(1-back(k,1.2))})`;e.style.filter=`blur(${(1-k)*14}px)`};
 }
 else if(TYPE==='ctaword'){ // studio CTA: small "Comment" + big quoted serif keyword with a blue glow (ref 7)
  const w=P('word')||'Guide', fs=(+P('size')||.085)*H, gl=P('glow')||'rgba(40,140,255,.75)';
  S.innerHTML=`<div class="abs" id="cw" style="left:0;right:0;top:${(+P('y')||.6)*H-fs*.8}px;text-align:center">
   <div id="w1" style="font-family:Pop;font-weight:500;font-size:${fs*.34}px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)">${esc(P('l1')||'Comment')}</div>

    const card=`<g transform="translate(540 560)" stroke="${ink}" stroke-width="${lw}"><rect x="-150" y="-95" width="300" height="190" rx="22" fill="#fff"/>
      <path d="M-25 -40 L35 0 L-25 40 Z" fill="#2F6FED" stroke-linejoin="round"/></g>`;
    const tick=seg(t,1.6,2.0)>0?`<g transform="translate(680 470) scale(${back(seg(t,1.6,2.0))})" stroke="${ink}" stroke-width="${lw}"><circle r="46" fill="#16A34A"/><path d="M-20 0 L-5 16 L22 -16" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>`:'';
    let fly=''; for(let i=0;i<5;i++){const q=eo(seg(t,.2+i*.25,.8+i*.25)); if(q<=0||q>=1)continue; fly+=clip(800+(540-800)*q, 1100+(560-1100)*q-Math.sin(q*Math.PI)*220, q*360, 1-q*.6);}
    g+=card+fly+tick;
    for(let i=0;i<6;i++){const ph=(t*.9+i/6)%1, ang=i*1.05; g+=`<path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z" transform="translate(${540+Math.cos(ang)*(190+ph*60)} ${560+Math.sin(ang)*(130+ph*40)}) scale(${1-ph})" fill="#FFD84A" stroke="${ink}" stroke-width="3"/>`;}
   }
   cv.innerHTML=bgSVG+g+front+sign; cv.style.opacity=o; cv.style.transform=`scale(${1.04-.04*k})`;};
 }
 else if(TYPE==='wipe'){ // transition: accent + white diagonal bars sweep across (use dur ~0.45)
  S.innerHTML=`<div id="b1" class="abs" style="top:-50%;height:200%;width:${W*.35}px;background:var(--acc);transform:skewX(-18deg)"></div>
   <div id="b2" class="abs" style="top:-50%;height:200%;width:${W*.08}px;background:#fff;transform:skewX(-18deg)"></div>`;
  render=t=>{const k=seg(t,0,DUR);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
   document.getElementById('b1').style.left=(-W*.6+e*W*1.9)+'px';document.getElementById('b2').style.left=(-W*.75+e*W*2.1)+'px'};
 }
 // step header (style ref 2): "STEP 03 / 07" label, progress dots, big faded number behind the card
 if(P('step')){const [n,tot]=P('step').split('/').map(x=>+x);const pad=v=>String(v).padStart(2,'0');
  const hd=document.createElement('div');hd.className='abs';hd.style.cssText=`left:${50*u}px;right:${50*u}px;top:${34*u}px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:${22*u}px;letter-spacing:.08em;color:var(--ink);opacity:.75`;
  hd.innerHTML=`<span>STEP ${pad(n)} / ${pad(tot)}</span><span>${Array.from({length:tot},(_,i)=>`<i style="display:inline-block;width:${11*u}px;height:${11*u}px;border-radius:50%;margin-left:${6*u}px;background:${i<n?'var(--acc)':'var(--line)'}"></i>`).join('')}</span>`;
  const big=document.createElement('div');big.className='abs';big.style.cssText=`right:${30*u}px;top:${H*.12}px;font-weight:800;font-size:${H*.55}px;line-height:1;color:var(--ink);opacity:.05`;big.textContent=n;
  S.prepend(big);S.appendChild(hd);const r0=render;render=t=>{r0(t);const k=eo(seg(t,0,.4));hd.style.opacity=.75*k*(1-outT(t));big.style.opacity=.05*k*(1-outT(t));big.style.transform=`translateY(${(1-k)*40}px)`;};}
 await document.fonts.ready; render(0); window.READY=true;
}
window.render=t=>render(t); window.DUR=DUR; build();
</script></body></html>
