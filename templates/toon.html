<!doctype html>
<html><head><meta charset="utf-8"><title>toon</title>
<style>
@font-face{font-family:Slab;src:url(../assets/fonts/ArchivoBlack-Regular.ttf);font-display:block}
@font-face{font-family:Jost;src:url(../assets/fonts/Poppins-Medium.ttf);font-weight:500;font-display:block}
html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0;display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
// Cartoon cut-aways for render_gfx.mjs (page contract: window.READY, window.render(t), window.DUR).
// Params: scene, l1, l2, items, dur, w, h. Engine: Lemo-Opuscar midcentury-toon (MIT).
import { textures } from './toon/engine/toon.js';
import { renderScene } from './toon/scenes.js';
const Q = new URLSearchParams(location.search), P = Object.fromEntries(Q.entries());
const W = +P.w || 1080, H = +P.h || 1920, cv = document.getElementById('c');
cv.width = W; cv.height = H; document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
const g = cv.getContext('2d');
await Promise.all(['44px Slab', '500 40px Jost'].map(f => document.fonts.load(f)));
textures();
window.DUR = +P.dur || 4;
window.render = t => { g.setTransform(1, 0, 0, 1, 0, 0); renderScene(g, W, H, t, P); };
window.render(0); window.READY = true;
</script></body></html>
